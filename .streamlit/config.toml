[server]
port = 8501
headless = true
address = "127.0.0.1"
maxUploadSize = 50
# 使用轮询模式（watchdog 不可用时的稳定方案）
fileWatcherType = "poll"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[runner]
# 快速重渲染
fastReruns = true
# 关闭魔法命令解析
magicEnabled = false
# 关闭 enumerate 显示
enumCoercion = "off"

[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#111111"
textColor = "#ffffff"
borderColor = "#2b2b2f"
showWidgetBorder = true
showSidebarBorder = false
font = "sans serif"

[logger]
# 减少日志输出
level = "error"
