# NASDX 配置文件示例
# 推荐复制到 Windows 用户配置目录：
#   %APPDATA%\NASDX\config.toml
# 也可以通过 NASDX_CONFIG_FILE 指定其它本地路径。
# 不要把真实 config.toml、.env 或 API Key 提交到 Git。

[llm]
# 支持任何 OpenAI 兼容接口：Agnes / DeepSeek / Qwen / GPT-4o / Ollama
api_key   = ""    # 必填；Agnes AI 平台获取：https://apihub.agnes-ai.com
base_url  = "https://apihub.agnes-ai.com/v1"   # Agnes AI（默认模型）
# base_url = "https://api.deepseek.com"         # DeepSeek（低成本备选）
# base_url = "https://api.openai.com/v1"        # OpenAI
# base_url = "http://localhost:11434/v1"        # Ollama 本地
model     = "agnes-2.5-flash"
fallback_models = "" # 非 Agnes 提供商时留空或显式填写其支持模型
# model   = "gpt-4o"
# model   = "qwen2.5:14b"
max_tokens  = 4096
temperature = 0.3

[analysis]
debate_rounds = 2    # Battle 辩论轮次（建议2-3）
max_steps     = 3    # 每 Agent 最大步数
agent_delay   = 1.0  # Agent 间隔秒数（避免 API 过速）
battle_delay  = 0.5  # 辩论间隔秒数

[output]
dir = "./reports"    # 报告输出目录

[paths]
# 可选：桌面/便携包运行目录。留空时源码 checkout 使用项目目录，便携包使用用户本地数据目录。
runtime_dir = ""
history_db  = ""
reports_dir = ""
