# NASDX secret-scan allowlist
#
# Consumed by nasdx/secret_scan.py (run_security_checks.py, run_final_audit.py
# and the security CI workflow all share this file).
#
# Rules enforced by the loader — a violation fails the security gate instead of
# being silently ignored:
#
#   * every entry needs a non-empty `reason`;
#   * every entry needs `path` (glob) and/or `fingerprint`; a bare `rule`
#     exemption would disable that rule repository-wide and is rejected;
#   * `path` may not be `*`, `**`, `**/*`, `*/*`, `.` or `./*`;
#   * `rule`, when present, must be a known rule id from nasdx/secret_scan.py;
#   * unknown keys are rejected.
#
# `fingerprint` is the first 16 hex chars of sha256(secret) as printed by the
# scanner, so an exemption can be pinned to one exact string without ever
# committing that string.
#
# Example (keep entries minimal and delete them once obsolete):
#
#   [[allow]]
#   rule = "generic-assigned-secret"
#   path = "docs/example_config.md"
#   reason = "documented placeholder in the config walkthrough"
#
# Current state: no exemptions are needed. Test fixtures build their fake
# credentials at runtime by concatenating fragments, so no literal token is
# ever committed and nothing has to be allowlisted.

allow = []
