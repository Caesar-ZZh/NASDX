name: Windows Desktop Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

# 显式最小权限：本 workflow 只读代码，不写 issue/PR/包/部署。
# 显式声明后，即便仓库默认 Actions 权限被改成 read-write，也不会被动放大。
permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-release-check:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      # 官方 Action 一律固定到 commit SHA（尾注版本号），tag 可被重新指向，
      # SHA 不能。升级由 Dependabot（.github/dependabot.yml）提 PR 驱动。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11.9"

      - name: Run required secret scan
        shell: pwsh
        run: |
          python -B scripts/run_security_checks.py --skip-optional

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install "pip==25.3" "uv==0.10.2"
          python -B scripts/run_dependency_lock_check.py --enforce-toolchain
          python -m pip install -r requirements-dev.txt

      - name: Run desktop release check without installer compile
        shell: pwsh
        run: |
          python -B scripts/run_desktop_release_check.py --skip-final-audit --fail-fast

      - name: Run delivery asset contracts
        shell: pwsh
        run: |
          python -m pytest tests/test_delivery_assets_contracts.py tests/test_desktop_release_check_contracts.py
