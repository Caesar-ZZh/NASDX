name: Auto-Align Audit (read-only)

# 2026-08-27 起停用定时触发（连续 12 次失败：仓库 secrets 未配置 LLM 凭据，
# 每 4 小时空跑一次）。需要时在 Actions 页面手动 Run workflow（可指定 issue 号）；
# 恢复定时前先给仓库配置 LLM_* / NASDX_* secrets。
on:
  workflow_dispatch:
    inputs:
      issue:
        description: "指定只处理某个 issue 号（留空则自动挑最高优先级）"
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: read

# 串行执行：避免同一时刻两个定时任务互相冲突或重复开 PR
concurrency:
  group: auto-align
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Install deps (best-effort)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          pip install pytest || true

      - name: Run auto-align worker
        env:
          GITHUB_REPO: Caesar-ZZh/cosmos
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.issue }}" ]; then
            ARGS="--issue ${{ github.event.inputs.issue }}"
          fi
          python scripts/auto_align_worker.py --dry-run $ARGS
