name: Final Audit Gate

# Release-gate integrity (#88): run_final_audit.py must exit 0 on master/release.
# A non-zero exit fails this job, so the final delivery gate can never be
# normalized to "21/22 except a known failure".

on:
  pull_request:
  push:
    branches:
      - main
      - master

# 显式最小权限：只读代码，不写 issue/PR/包/部署。
permissions:
  contents: read

concurrency:
  group: final-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-audit:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      # 官方 Action 一律固定到 commit SHA（尾注版本号），tag 可被重新指向，
      # SHA 不能。升级由 Dependabot（.github/dependabot.yml）提 PR 驱动。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11.9"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          # server/ 下的契约测试（SPA 路径穿越防护、内置 LLM key 锁定等）
          # 需要 fastapi/uvicorn。只装 requirements-dev.txt 会让这些测试以
          # ModuleNotFoundError 红灯，掩盖真实回归。测试内另做了 skip 兜底，
          # 但不该依赖兜底来跑这道门。
          python -m pip install -r server/requirements.txt

      - name: Run final delivery audit (release gate)
        shell: pwsh
        run: |
          python scripts/run_final_audit.py

      # 契约测试回归门（#124 收尾）：scripts/ 迁移后 13 个契约测试曾因路径失效
      # 静默通过 final-audit，这里补一道 pytest 硬门，路径失效/导入回归立即红灯。
      # pytest 在 requirements-dev.txt 中；pyproject 已配置 pythonpath=["scripts"]。
      - name: Run contract tests (regression gate)
        shell: pwsh
        run: |
          python -m pytest -q
