name: Final Audit Gate

# Release-gate integrity (#88): run_final_audit.py must exit 0 on master/release.
# A non-zero exit fails this job, so the final delivery gate can never be
# normalized to "21/22 except a known failure".

on:
  pull_request:
  push:
    branches:
      - main
      - master

# 显式最小权限：只读代码，不写 issue/PR/包/部署。
permissions:
  contents: read

concurrency:
  group: final-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-audit:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      # 官方 Action 一律固定到 commit SHA（尾注版本号），tag 可被重新指向，
      # SHA 不能。升级由 Dependabot（.github/dependabot.yml）提 PR 驱动。
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run final delivery audit (release gate)
        shell: pwsh
        run: |
          python scripts/run_final_audit.py
